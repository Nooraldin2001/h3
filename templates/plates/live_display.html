{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Live Auction Display</title>
  <link rel="stylesheet" href="{% static 'css/live-plate.css' %}?v=sharjah-fujairah-pos" />
  <link rel="stylesheet" href="{% static 'css/live-display.css' %}?v=price-black" />
</head>
<body>
  <div class="bg-watermark" aria-hidden="true">
    <img src="{% static 'plates/live/watermark.jpeg' %}" alt="" />
  </div>

  <div class="live-display">
    <div class="alert-banner" id="alert-banner"></div>

    <div class="live-content">
      <div class="live-timer" id="live-timer">00:00</div>

      <div class="live-plate-stage">
        <div class="live-plate-frame" id="plate-display"></div>
      </div>

      <div class="price-box" id="price-box" style="display:none;" dir="ltr">
        <span class="price-value" id="price-value">0</span>
        <span class="price-currency">
          <img src="{% static 'css/aed.svg' %}" alt="AED" />
        </span>
      </div>
    </div>

    <div class="message-banner" id="message-banner" aria-live="polite">
      <div class="message-banner-viewport">
        <div class="message-banner-track" id="message-ticker-track"></div>
      </div>
    </div>
  </div>

  <script src="{% static 'js/live-plate.js' %}?v=dubai-yellow-classic"></script>
  <script>
    const TOKEN = "{{ token }}";
    const IMAGE_BASE = "{% static 'plates/' %}";
    const PLATE_IMAGE_VERSION = "dubai-yellow-classic";
    window.PLATE_IMAGE_VERSION = PLATE_IMAGE_VERSION;
    let state = {{ state_json|safe }};
    let spinnerIndex = 0;
    const plateSpinner = createLivePlateSpinner(() => {
      spinnerIndex = (spinnerIndex + 1) % LIVE_PLATE_TYPES.length;
      renderPlateView();
    }, 2000);

    function renderPlateView() {
      const plateType = getLiveDisplayPlateType(
        state.plate_type,
        state.code,
        state.number,
        spinnerIndex
      );
      renderLivePlate({
        plateType,
        code: state.code,
        number: state.number,
        imageBaseUrl: IMAGE_BASE,
        container: document.getElementById("plate-display"),
      });
    }

    function syncPlateSpinner() {
      if (isLivePlateEmpty(state.code, state.number)) {
        plateSpinner.start();
      } else {
        plateSpinner.stop();
        spinnerIndex = 0;
      }
    }

    function render(state) {
      syncPlateSpinner();
      renderPlateView();

      document.getElementById("live-timer").textContent = formatTimer(state.timer_remaining_seconds);

      const priceBox = document.getElementById("price-box");
      const priceVal = document.getElementById("price-value");
      if (state.price) {
        priceBox.style.display = "flex";
        priceVal.textContent = formatLivePrice(state.price);
      } else {
        priceBox.style.display = "none";
      }

      const alertBanner = document.getElementById("alert-banner");
      if (state.alert_message && state.alert_message.trim()) {
        alertBanner.textContent = state.alert_message;
        alertBanner.classList.add("visible");
      } else {
        alertBanner.classList.remove("visible");
      }

      const msgBanner = document.getElementById("message-banner");
      const msgTrack = document.getElementById("message-ticker-track");
      if (state.message && state.message.trim()) {
        const text = state.message.trim();
        if (msgTrack.dataset.tickerText !== text) {
          msgTrack.dataset.tickerText = text;
          msgTrack.innerHTML = "";
          for (let i = 0; i < 2; i++) {
            const span = document.createElement("span");
            span.className = "message-banner-text";
            span.textContent = text;
            if (i === 1) span.setAttribute("aria-hidden", "true");
            msgTrack.appendChild(span);
          }
          const duration = Math.max(24, text.length * 0.55);
          msgTrack.style.animation = "none";
          void msgTrack.offsetWidth;
          msgTrack.style.animation = `message-ticker-scroll ${duration}s linear infinite`;
        }
        msgBanner.classList.add("visible");
      } else {
        msgTrack.dataset.tickerText = "";
        msgTrack.innerHTML = "";
        msgTrack.style.animation = "";
        msgBanner.classList.remove("visible");
      }
    }

    async function poll() {
      const res = await fetch("/live/api/state/?token=" + encodeURIComponent(TOKEN));
      if (!res.ok) return;
      state = await res.json();
      render(state);
    }

    render(state);
    setInterval(poll, 1000);
  </script>
</body>
</html>
