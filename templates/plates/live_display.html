{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Live Auction Display</title>
  <link rel="stylesheet" href="{% static 'css/live-plate.css' %}?v=phone-text-bigger" />
  <link rel="stylesheet" href="{% static 'css/live-display.css' %}?v=phone-frame-transparent" />
</head>
<body>
  <div class="bg-watermark" aria-hidden="true">
    <img src="{% static 'plates/live/watermark.jpeg' %}" alt="" />
  </div>

  <div class="live-display">
    <div class="alert-banner" id="alert-banner"></div>

    <div class="live-content">
      <div class="live-timer" id="live-timer">00:00</div>

      <div class="live-plate-stage" id="live-plate-stage">
        <div class="live-plate-frame" id="plate-display"></div>
      </div>

      <div class="price-box" id="price-box" style="display:none;" dir="ltr">
        <span class="price-value" id="price-value">0</span>
        <span class="price-currency">
          <img src="{% static 'css/aed.svg' %}" alt="AED" />
        </span>
      </div>
    </div>

    <div class="message-banner" id="message-banner" aria-live="polite">
      <div class="message-banner-viewport">
        <div class="message-banner-track" id="message-ticker-track"></div>
      </div>
    </div>
  </div>

  <section class="live-sold-overlay" id="live-sold-overlay" aria-hidden="true">
    <div class="live-sold-backdrop"></div>
    <div class="live-confetti" id="live-confetti"></div>
    <div class="live-gavel-stage" id="live-gavel-stage" aria-hidden="true">
      <div class="live-gavel-impact"></div>
      <div class="live-gavel-ring live-gavel-ring--1"></div>
      <div class="live-gavel-ring live-gavel-ring--2"></div>
      <div class="live-gavel-ring live-gavel-ring--3"></div>
      <div class="live-gavel-sparks" id="live-gavel-sparks"></div>
      <svg class="live-gavel-svg" viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <!-- Sounding block (dark wood plate) -->
        <ellipse cx="120" cy="196" rx="58" ry="16" fill="#1f120a"/>
        <ellipse cx="120" cy="190" rx="50" ry="13" fill="#3d2415"/>
        <ellipse cx="120" cy="186" rx="42" ry="9" fill="#5c3d1e"/>
        <g class="live-gavel-swing">
          <!-- Handle angled like a real auction gavel -->
          <g transform="rotate(-38 120 158)">
            <rect x="113" y="30" width="14" height="128" rx="7" fill="#3d2415"/>
            <rect x="115" y="34" width="10" height="120" rx="5" fill="#5c3d1e"/>
            <ellipse cx="120" cy="28" rx="11" ry="9" fill="#6b4423"/>
            <ellipse cx="120" cy="26" rx="7" ry="5" fill="#8b5a2b"/>
          </g>
          <!-- Cylindrical head + gold band; striking face flush on the block -->
          <rect x="70" y="148" width="100" height="36" rx="18" fill="#2a1810"/>
          <rect x="74" y="152" width="92" height="28" rx="14" fill="#3d2415"/>
          <rect x="74" y="154" width="14" height="24" rx="7" fill="#1f120a"/>
          <rect x="152" y="154" width="14" height="24" rx="7" fill="#1f120a"/>
          <rect x="104" y="148" width="32" height="36" fill="#b8860b"/>
          <rect x="108" y="152" width="24" height="28" fill="#d4af37"/>
          <rect x="112" y="156" width="16" height="20" fill="#f0d78c"/>
          <rect x="118" y="158" width="4" height="16" fill="#fff3c4" opacity="0.55"/>
        </g>
      </svg>
    </div>
    <div class="live-sold-card">
      <div class="live-sold-title">تم البيع</div>
      <div class="live-sold-name" id="live-sold-name" hidden></div>
      <div class="live-sold-plate" id="live-sold-plate"></div>
      <div class="live-sold-price" id="live-sold-price"></div>
    </div>
  </section>

  <script src="{% static 'js/live-plate.js' %}?v=phone-frame-transparent"></script>
  <script>
    const TOKEN = "{{ token }}";
    const IMAGE_BASE = "{% static 'plates/' %}";
    const PLATE_IMAGE_VERSION = "phone-frame-transparent";
    window.PLATE_IMAGE_VERSION = PLATE_IMAGE_VERSION;
    let state = {{ state_json|safe }};
    let spinnerIndex = 0;
    let lastSoldEventId = Number(state.sold_event_id) || 0;
    let soldTimer = null;
    let soldRunning = false;
    const plateSpinner = createLivePlateSpinner(() => {
      spinnerIndex = (spinnerIndex + 1) % LIVE_EMIRATE_PLATE_TYPES.length;
      renderPlateView();
    }, 2000);

    function renderPlateView() {
      const plateType = getLiveDisplayPlateType(
        state.plate_type,
        state.code,
        state.number,
        spinnerIndex,
        state.phone_number
      );
      const stage = document.getElementById("live-plate-stage");
      if (stage) {
        stage.classList.toggle("is-phone-pallet", isLivePhonePlateType(state.plate_type));
      }
      renderLivePlate({
        plateType,
        code: state.code,
        number: state.number,
        phoneNumber: state.phone_number,
        imageBaseUrl: IMAGE_BASE,
        container: document.getElementById("plate-display"),
      });
    }

    function syncPlateSpinner() {
      if (
        isLivePhonePlateType(state.plate_type) ||
        !isLivePlateEmpty(state.code, state.number, state.plate_type, state.phone_number)
      ) {
        plateSpinner.stop();
        spinnerIndex = 0;
      } else {
        plateSpinner.start();
      }
    }

    function makeConfetti() {
      const confetti = document.getElementById("live-confetti");
      if (!confetti) return;
      const colors = ["#6f41a4", "#c9a535", "#edd97a", "#d32f2f", "#ffffff", "#a78bfa"];
      confetti.innerHTML = "";
      for (let i = 0; i < 50; i += 1) {
        const piece = document.createElement("span");
        piece.className = "live-confetti-piece";
        const size = 4 + Math.random() * 10;
        piece.style.left = `${5 + Math.random() * 90}%`;
        piece.style.top = `${5 + Math.random() * 55}%`;
        piece.style.width = `${size * 0.7}px`;
        piece.style.height = `${size * 1.4}px`;
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.borderRadius = Math.random() > 0.65 ? "50%" : "2px";
        piece.style.setProperty("--delay", `${Math.random() * 1.5}s`);
        piece.style.setProperty("--duration", `${1.8 + Math.random() * 1.4}s`);
        confetti.appendChild(piece);
      }
    }

    function makeGavelSparks() {
      const sparks = document.getElementById("live-gavel-sparks");
      if (!sparks) return;
      const colors = ["#edd97a", "#c9a535", "#f0e0a0", "#ffffff", "#ffe9a0"];
      const hitDelays = [0.19, 0.53, 0.86];
      sparks.innerHTML = "";
      hitDelays.forEach((hitDelay) => {
        for (let i = 0; i < 14; i += 1) {
          const piece = document.createElement("span");
          piece.className = "live-gavel-spark";
          const angle = (Math.PI * 2 * i) / 14 + (Math.random() * 0.4 - 0.2);
          const dist = 40 + Math.random() * 90;
          piece.style.setProperty("--dx", `${Math.cos(angle) * dist}px`);
          piece.style.setProperty("--dy", `${Math.sin(angle) * dist * 0.55 - 20}px`);
          piece.style.setProperty("--delay", `${hitDelay + Math.random() * 0.08}s`);
          piece.style.setProperty("--size", `${3 + Math.random() * 5}px`);
          piece.style.background = colors[Math.floor(Math.random() * colors.length)];
          sparks.appendChild(piece);
        }
      });
    }

    function normalizeSoldStyle(style) {
      return style === "gavel" ? "gavel" : "confetti";
    }

    window.triggerSoldCelebration = function (details = {}) {
      const overlay = document.getElementById("live-sold-overlay");
      const soldPlate = document.getElementById("live-sold-plate");
      const soldPrice = document.getElementById("live-sold-price");
      const soldName = document.getElementById("live-sold-name");
      const gavelStage = document.getElementById("live-gavel-stage");
      if (!overlay) return;

      if (soldRunning) {
        clearTimeout(soldTimer);
        overlay.classList.remove("visible", "sold-style-gavel", "sold-style-confetti");
        void overlay.offsetWidth;
      }

      soldRunning = true;
      const style = normalizeSoldStyle(details.style || details.sold_style || state.sold_style);
      const detail = {
        plateType: details.plateType || details.plate_type || state.plate_type,
        code: details.code !== undefined ? details.code : state.code,
        number: details.number !== undefined ? details.number : state.number,
        phoneNumber: details.phoneNumber !== undefined ? details.phoneNumber : (details.phone_number !== undefined ? details.phone_number : state.phone_number),
        price: details.price !== undefined ? details.price : state.price,
        name: details.name !== undefined ? details.name : (details.sold_name !== undefined ? details.sold_name : state.sold_name),
      };

      overlay.classList.remove("sold-style-gavel", "sold-style-confetti");
      overlay.classList.add(style === "gavel" ? "sold-style-gavel" : "sold-style-confetti");

      if (soldPlate) {
        soldPlate.classList.toggle("is-phone-pallet", isLivePhonePlateType(detail.plateType));
      }

      renderLivePlate({
        plateType: detail.plateType,
        code: detail.code,
        number: detail.number,
        phoneNumber: detail.phoneNumber,
        imageBaseUrl: IMAGE_BASE,
        container: soldPlate,
      });

      if (soldName) {
        const name = String(detail.name || "").trim();
        soldName.textContent = name;
        soldName.hidden = !name;
      }

      if (soldPrice) {
        const price = detail.price ? formatLivePrice(detail.price) : "";
        soldPrice.textContent = price ? `${price} AED` : "";
      }

      if (style === "gavel") {
        document.getElementById("live-confetti").innerHTML = "";
        makeGavelSparks();
        if (gavelStage) gavelStage.setAttribute("aria-hidden", "false");
      } else {
        if (gavelStage) gavelStage.setAttribute("aria-hidden", "true");
        makeConfetti();
      }

      overlay.classList.add("visible");
      overlay.setAttribute("aria-hidden", "false");

      const soldDurationMs = style === "gavel" ? 6500 : 5000;
      soldTimer = setTimeout(() => {
        overlay.classList.remove("visible", "sold-style-gavel", "sold-style-confetti");
        overlay.setAttribute("aria-hidden", "true");
        if (gavelStage) gavelStage.setAttribute("aria-hidden", "true");
        soldRunning = false;
      }, soldDurationMs);
    };

    window.addEventListener("auction:sold", function (event) {
      window.triggerSoldCelebration(event.detail || {});
    });

    function handleSoldEvent(currentState) {
      const soldEventId = Number(currentState.sold_event_id) || 0;
      if (!soldEventId || soldEventId <= lastSoldEventId) return;
      lastSoldEventId = soldEventId;
      window.triggerSoldCelebration({
        plateType: currentState.plate_type,
        code: currentState.code,
        number: currentState.number,
        phoneNumber: currentState.phone_number,
        price: currentState.price,
        style: currentState.sold_style,
        name: currentState.sold_name,
      });
    }

    function render(currentState) {
      syncPlateSpinner();
      renderPlateView();

      const timerEl = document.getElementById("live-timer");
      const remaining = Number(currentState.timer_remaining_seconds) || 0;
      const urgent = Boolean(currentState.timer_active) && remaining <= 10 && remaining > 0;
      timerEl.textContent = formatTimer(remaining);
      timerEl.classList.toggle("urgent", urgent);

      const priceBox = document.getElementById("price-box");
      const priceVal = document.getElementById("price-value");
      if (currentState.price) {
        priceBox.style.display = "flex";
        priceVal.textContent = formatLivePrice(currentState.price);
      } else {
        priceBox.style.display = "none";
      }

      const alertBanner = document.getElementById("alert-banner");
      if (currentState.alert_message && currentState.alert_message.trim()) {
        alertBanner.textContent = currentState.alert_message;
        alertBanner.classList.add("visible");
      } else {
        alertBanner.classList.remove("visible");
      }

      const msgBanner = document.getElementById("message-banner");
      const msgTrack = document.getElementById("message-ticker-track");
      if (currentState.message && currentState.message.trim()) {
        const text = currentState.message.trim();
        if (msgTrack.dataset.tickerText !== text) {
          msgTrack.dataset.tickerText = text;
          msgTrack.innerHTML = "";
          for (let i = 0; i < 2; i++) {
            const span = document.createElement("span");
            span.className = "message-banner-text";
            span.textContent = text;
            if (i === 1) span.setAttribute("aria-hidden", "true");
            msgTrack.appendChild(span);
          }
          const duration = Math.max(24, text.length * 0.55);
          msgTrack.style.animation = "none";
          void msgTrack.offsetWidth;
          msgTrack.style.animation = `message-ticker-scroll ${duration}s linear infinite`;
        }
        msgBanner.classList.add("visible");
      } else {
        msgTrack.dataset.tickerText = "";
        msgTrack.innerHTML = "";
        msgTrack.style.animation = "";
        msgBanner.classList.remove("visible");
      }
    }

    async function poll() {
      const res = await fetch("/live/api/state/?token=" + encodeURIComponent(TOKEN));
      if (!res.ok) return;
      state = await res.json();
      render(state);
      handleSoldEvent(state);
    }

    render(state);
    setInterval(poll, 1000);
  </script>
</body>
</html>
