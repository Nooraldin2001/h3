{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Live Auction Display - TikTok</title>
  <link rel="stylesheet" href="{% static 'css/live-display-tiktok.css' %}?v=14-phone-text-5rem" />
</head>
<body class="live-display-tiktok">
  <div class="tld-root" id="tld-root">
    <div class="tld-bg-watermark" id="tld-bg-watermark" aria-hidden="true">
      <img id="tld-bg-watermark-img" src="{% static 'live_new/images/watermark.jpeg' %}?v=1" alt="" />
    </div>

    <header class="tld-header">
      <div class="tld-logo-wrap" id="tld-logo-wrap">
        <img class="tld-custom-logo" id="tld-custom-logo" alt="H3 Auctions" />
        <img class="tld-default-logo" id="tld-default-logo" src="{% static 'live_new/images/h3-logo.jpeg' %}?v=3" alt="H3 Auctions" />
      </div>
      <div class="tld-event-title" id="tld-event-title">مزاد علني مباشر لبيع وشراء الأرقام المميزة</div>
    </header>

    <section class="tld-alert" id="tld-alert" role="alert" aria-live="assertive">
      <span id="tld-alert-text"></span>
    </section>

    <main class="tld-main">
      <section class="tld-timer-wrap" id="tld-timer-wrap" aria-label="Countdown timer">
        <div class="tld-timer tabular-nums" id="tld-timer">00:00</div>
      </section>

      <section class="tld-plate-stage" aria-label="Live auction plate">
        <div class="tld-plate-frame" id="tld-plate-frame"></div>
      </section>

      <section class="tld-price" id="tld-price" aria-label="Current bid">
        <div class="tld-price-label">السعر الحالي</div>
        <div class="tld-price-box" dir="ltr">
          <span class="tld-price-currency">AED</span>
          <span class="tld-price-value tabular-nums" id="tld-price-value">0</span>
        </div>
      </section>
    </main>

    <section class="tld-ticker" id="tld-ticker" aria-label="شريط الأخبار" aria-live="polite">
      <div class="tld-ticker-mask">
        <div class="tld-ticker-track" id="tld-ticker-track"></div>
      </div>
    </section>

    <section class="tld-sold-overlay" id="tld-sold-overlay" aria-hidden="true">
      <div class="tld-sold-backdrop"></div>
      <div class="tld-confetti" id="tld-confetti"></div>
      <div class="tld-gavel-stage" id="tld-gavel-stage" aria-hidden="true">
        <div class="tld-gavel-impact"></div>
        <div class="tld-gavel-ring tld-gavel-ring--1"></div>
        <div class="tld-gavel-ring tld-gavel-ring--2"></div>
        <div class="tld-gavel-ring tld-gavel-ring--3"></div>
        <div class="tld-gavel-sparks" id="tld-gavel-sparks"></div>
        <svg class="tld-gavel-svg" viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <ellipse cx="120" cy="196" rx="58" ry="16" fill="#1f120a"/>
          <ellipse cx="120" cy="190" rx="50" ry="13" fill="#3d2415"/>
          <ellipse cx="120" cy="186" rx="42" ry="9" fill="#5c3d1e"/>
          <g class="tld-gavel-swing">
            <g transform="rotate(-38 120 158)">
              <rect x="113" y="30" width="14" height="128" rx="7" fill="#3d2415"/>
              <rect x="115" y="34" width="10" height="120" rx="5" fill="#5c3d1e"/>
              <ellipse cx="120" cy="28" rx="11" ry="9" fill="#6b4423"/>
              <ellipse cx="120" cy="26" rx="7" ry="5" fill="#8b5a2b"/>
            </g>
            <rect x="70" y="148" width="100" height="36" rx="18" fill="#2a1810"/>
            <rect x="74" y="152" width="92" height="28" rx="14" fill="#3d2415"/>
            <rect x="74" y="154" width="14" height="24" rx="7" fill="#1f120a"/>
            <rect x="152" y="154" width="14" height="24" rx="7" fill="#1f120a"/>
            <rect x="104" y="148" width="32" height="36" fill="#b8860b"/>
            <rect x="108" y="152" width="24" height="28" fill="#d4af37"/>
            <rect x="112" y="156" width="16" height="20" fill="#f0d78c"/>
            <rect x="118" y="158" width="4" height="16" fill="#fff3c4" opacity="0.55"/>
          </g>
        </svg>
      </div>
      <div class="tld-sold-card">
        <div class="tld-sold-title">تم البيع</div>
        <div class="tld-sold-name" id="tld-sold-name" hidden></div>
        <div class="tld-sold-plate" id="tld-sold-plate"></div>
        <div class="tld-sold-price" id="tld-sold-price"></div>
      </div>
    </section>
  </div>

  <script>
    window.LIVE_DISPLAY_TIKTOK_CONFIG = {
      token: "{{ token }}",
      state: {{ state_json|safe }},
      apiUrl: "{% url 'live_state_api' %}",
      imageBaseUrl: "{% static 'live_new/plates/' %}",
      plateImageVersion: "phone-frame-transparent",
      logoUrl: "{% static 'live_new/images/h3-logo.jpeg' %}?v=3",
      watermarkUrl: "{% static 'live_new/images/watermark.jpeg' %}?v=1",
    };
  </script>
  <script src="{% static 'js/live-display-tiktok.js' %}?v=14-phone-frame-transparent"></script>
</body>
</html>
