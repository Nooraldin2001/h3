{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Live Auction Display - New Style</title>
  <link rel="stylesheet" href="{% static 'css/live-display-new.css' %}?v=14-gavel-photo" />
</head>
<body class="live-display-new">
  <div class="nld-root">
    <div class="nld-ambient" aria-hidden="true">
      <div class="nld-ambient-main"></div>
      <div class="nld-ambient-red"></div>
    </div>

    <header class="nld-header">
      <div class="nld-brand">
        <div class="nld-logo-wrap">
          <img class="nld-custom-logo" id="nld-custom-logo" alt="H3 Auctions" />
          <img class="nld-default-logo" id="nld-default-logo" src="{% static 'live_new/images/h3-logo.jpeg' %}?v=3" alt="H3 Auctions" />
        </div>
        <div class="nld-brand-text">H3 Auctions</div>
      </div>

      <div class="nld-event-title" id="nld-event-title">مزاد علني مباشر لبيع وشراء الأرقام المميزة</div>

      <div class="nld-live-chip" aria-label="Live">
        <span></span>
        LIVE
      </div>
    </header>

    <section class="nld-alert" id="nld-alert" role="alert" aria-live="assertive">
      <span class="nld-alert-icon" aria-hidden="true">!</span>
      <span id="nld-alert-text"></span>
    </section>

    <main class="nld-main">
      <section class="nld-timer-wrap" aria-label="Countdown timer">
        <div class="nld-timer-progress" aria-hidden="true">
          <span id="nld-timer-progress-bar"></span>
        </div>
        <div class="nld-timer tabular-nums" id="nld-timer">00:00</div>
        <div class="nld-timer-state" id="nld-timer-state">STANDBY</div>
      </section>

      <section class="nld-plate-stage" aria-label="Live auction plate">
        <div class="nld-plate-glow" id="nld-plate-glow" aria-hidden="true"></div>
        <div class="nld-plate-frame" id="nld-plate-frame"></div>
        <div class="nld-idle-label" id="nld-idle-label">AWAITING NEXT LOT</div>
      </section>

      <section class="nld-price" id="nld-price" aria-label="Current bid">
        <div class="nld-price-label">السعر الحالي</div>
        <div class="nld-price-box" dir="ltr">
          <span class="nld-price-currency">AED</span>
          <span class="nld-price-value tabular-nums" id="nld-price-value">0</span>
        </div>
      </section>
    </main>

    <section class="nld-ticker" id="nld-ticker" aria-label="شريط الأخبار" aria-live="polite">
      <div class="nld-ticker-mask">
        <div class="nld-ticker-track" id="nld-ticker-track"></div>
      </div>
    </section>

    <section class="nld-sold-overlay" id="nld-sold-overlay" aria-hidden="true">
      <div class="nld-sold-backdrop"></div>
      <div class="nld-confetti" id="nld-confetti"></div>
      <div class="nld-gavel-stage" id="nld-gavel-stage" aria-hidden="true">
        <div class="nld-gavel-impact"></div>
        <div class="nld-gavel-ring nld-gavel-ring--1"></div>
        <div class="nld-gavel-ring nld-gavel-ring--2"></div>
        <div class="nld-gavel-ring nld-gavel-ring--3"></div>
        <div class="nld-gavel-sparks" id="nld-gavel-sparks"></div>
        <svg class="nld-gavel-svg" viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <ellipse cx="120" cy="196" rx="58" ry="16" fill="#1f120a"/>
          <ellipse cx="120" cy="190" rx="50" ry="13" fill="#3d2415"/>
          <ellipse cx="120" cy="186" rx="42" ry="9" fill="#5c3d1e"/>
          <g class="nld-gavel-swing">
            <g transform="rotate(-38 120 158)">
              <rect x="113" y="30" width="14" height="128" rx="7" fill="#3d2415"/>
              <rect x="115" y="34" width="10" height="120" rx="5" fill="#5c3d1e"/>
              <ellipse cx="120" cy="28" rx="11" ry="9" fill="#6b4423"/>
              <ellipse cx="120" cy="26" rx="7" ry="5" fill="#8b5a2b"/>
            </g>
            <rect x="70" y="148" width="100" height="36" rx="18" fill="#2a1810"/>
            <rect x="74" y="152" width="92" height="28" rx="14" fill="#3d2415"/>
            <rect x="74" y="154" width="14" height="24" rx="7" fill="#1f120a"/>
            <rect x="152" y="154" width="14" height="24" rx="7" fill="#1f120a"/>
            <rect x="104" y="148" width="32" height="36" fill="#b8860b"/>
            <rect x="108" y="152" width="24" height="28" fill="#d4af37"/>
            <rect x="112" y="156" width="16" height="20" fill="#f0d78c"/>
            <rect x="118" y="158" width="4" height="16" fill="#fff3c4" opacity="0.55"/>
          </g>
        </svg>
      </div>
      <div class="nld-sold-card">
        <div class="nld-sold-title">تم البيع</div>
        <div class="nld-sold-name" id="nld-sold-name" hidden></div>
        <div class="nld-sold-plate" id="nld-sold-plate"></div>
        <div class="nld-sold-price" id="nld-sold-price"></div>
      </div>
    </section>
  </div>

  <script>
    window.LIVE_DISPLAY_NEW_CONFIG = {
      token: "{{ token }}",
      state: {{ state_json|safe }},
      apiUrl: "{% url 'live_state_api' %}",
      imageBaseUrl: "{% static 'live_new/plates/' %}",
      plateImageVersion: "live-new-v2",
    };
  </script>
  <script src="{% static 'js/live-display-new.js' %}?v=10-sold-12s"></script>
</body>
</html>
